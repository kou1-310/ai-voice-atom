[env:m5stack-atoms3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
#upload_port = /dev/ttyACM0
; .env ファイルを読み込んで WIFI_SSID / WIFI_PASSWORD / HOST_BASE_URL を注入する
extra_scripts = pre:load_env.py
build_flags =
  -DESP32S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; WIFI_SSID / WIFI_PASSWORD / HOST_BASE_URL は load_env.py が .env から注入する
lib_deps =
  m5stack/M5Unified
  links2004/WebSockets @ ^2.6.1
  bblanchon/ArduinoJson @ ^7.0.0
